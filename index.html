<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, 
initial-scale=1.0"> 
    <title>Interactive Sorting Visualizer</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
    <header> 
        <h1>Sorting Algorithm Visualizer</h1> 
        <div class="control-panel"> 
            <button id="btn-random">Generate New Array</button> 
             
            <div class="control-group"> 
                <label for="algo-select">Algorithm:</label> 
                <select id="algo-select"> 
                    <option value="bubble">Bubble Sort</option> 
                    <option value="selection">Selection 
Sort</option> 
                </select> 
            </div> 
 
            <div class="control-group"> 
                <label for="speed-range">Speed:</label> 
                <input type="range" id="speed-range" min="1" 
max="100" value="50"> 
            </div> 
 
            <button id="btn-sort" class="action-btn">Sort!</button> 
        </div> 
    </header> 
 
    <main> 
        <div id="visualizer-container"></div> 
    </main> 
 
    <footer> 
        <div class="stat-box">Comparisons: <span 
id="stat-comparisons">0</span></div> 
        <div class="stat-box">Swaps: <span 
id="stat-swaps">0</span></div> 
    </footer> 
 
    <script src="script.js"></script> 
</body> 
</html>
